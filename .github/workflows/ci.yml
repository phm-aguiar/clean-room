# CI do ai-memory (feature 001-nucleo, T069).
#
# Propósito: rodar em cada push e pull request para a branch main, em
# windows-latest e ubuntu-latest, o portão de qualidade definido em
# scripts/check.sh (T067: build cruzado CGO_ENABLED=0 para windows/amd64 e
# linux/amd64, go vet e go test -race) e o linter golangci-lint (T068, config
# em .golangci.yml, formato v2: errcheck, govet, staticcheck e gofmt).
# Constituição: .github/memory/constitution.md, seção "Portões de Qualidade".
#
# Versão do Go: vem de go.mod (go-version-file), nunca fixada aqui.
#
# -race no Windows: o go test -race exige gcc (cgo). O runner windows-latest
# não traz gcc no PATH, então o job instala MinGW-w64 UCRT64 via MSYS2
# (ação msys2/setup-msys2, pacote mingw-w64-ucrt-x86_64-gcc) e adiciona
# C:\msys64\ucrt64\bin ao PATH para os passos seguintes. Assim o check.sh roda
# COMPLETO nos dois sistemas, sem pular o -race.
#
# Permissões: somente leitura do repositório (contents: read).
#
# Limitação: este arquivo não foi executado no GitHub Actions a partir do
# ambiente de desenvolvimento; a validação local foi apenas sintática (YAML).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go (versão lida de go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar gcc MinGW-w64 para -race (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Adicionar gcc ao PATH e verificar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'
          $env:PATH = 'C:\msys64\ucrt64\bin;' + $env:PATH
          gcc --version

      - name: Verificação de qualidade (scripts/check.sh)
        shell: bash
        run: sh scripts/check.sh

      - name: Linter (golangci-lint, config em .golangci.yml)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
